[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "day27-sandbox"
version = "0.1.0"
description = "Udemy 100 Days of Code, day 27: Tkinter, default arguments, *args and **kwargs."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# No runtime dependencies: the project uses only the standard library.
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
    "yamllint==1.38.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Descriptor-level capture makes Tcl fail intermittently to read init.tcl on
# Windows, so Tkinter tests would be flaky; capture at the sys level only.
addopts = ["--capture=sys"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
extend-exclude = ["framework", ".venv"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
